{% set name = "scramp" %}
{% set version = "1.4.17" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 28970f29ebc33df47f9975c805e5e5a360effe5b31045e607d64b3b60370dba1

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - hatchling
    - versioningit
  run:
    - python
    - asn1crypto >=1.5.1

test:
  source_files:
    - README.md
    - test/test_import_all.py
    - test/test_readme.py
    - test/test_scramp.py
    - test/test_utils.py
  imports:
    - scramp
    - scramp.core
    - scramp.utils
  commands:
    - pip check
    - pytest -vv test
  requires:
    - pip
    - pytest
    - pytest-mock

about:
  home: https://codeberg.org/tlocke/scramp
  summary: A pure-Python implementation of the SCRAM authentication protocol
  license: MIT
  license_family: MIT
  license_file: LICENSE
  description: |
    A Python implementation of the SCRAM authentication protocol defined by
    RFC 5802 and RFC 7677.
  dev_url: https://codeberg.org/tlocke/scramp
  doc_url: https://codeberg.org/tlocke/scramp/src/branch/main/README.md

extra:
  recipe-maintainers:
    - nicolas-geniteau
    - maximerihouey
    - ncolomer
